interface:
  display_name: "Arquinovatos - Rendering IMG 2 PBR"
  short_description: "Mapas PBR revisados primero; visor HTML opcional"
  default_prompt: "Usa $arquinovatos-rendering-img-2-pbr para generar y revisar los mapas PBR del material señalado. Corrige el albedo en bucle hasta aprobarlo y continúa automáticamente con los demás mapas, con subagentes en paralelo cuando sea posible. Entrega los PNG con Normal DX/OpenGL y después pregúntame si quiero el visor HTML."
