<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164f66">
  <meta name="description" content="Fotografía, mapas PBR, prompts y probador de materiales en tiempo real.">
  <title>Arquinovatos · Foto a PBR</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('arquinovatos-pbr-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch{document.documentElement.dataset.theme='dark';}</script>
  <link rel="stylesheet" href="styles.css">
  <script src="cases.js" defer></script>
  <script src="pbr-math.js" defer></script>
  <script src="pbr-viewer.js" defer></script>
  <script src="review.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand" role="img" aria-label="Arquinovatos"><img class="logo-dark" src="logo-dark.png" width="3440" height="1440" alt=""><img class="logo-light" src="logo-light.png" width="3440" height="1440" alt=""></div>
    <div class="header-actions"><nav id="brand-social" class="brand-social" aria-label="Redes oficiales" hidden></nav><button id="theme-toggle" type="button">Cambiar tema</button></div>
  </header>
  <main>
    <div class="intro">
      <h1>Los mejores recursos para render en arquinovatos.com</h1>
      <a id="brand-information" class="information-link" target="_blank" rel="noopener noreferrer" hidden>Más información</a>
    </div>
    <nav class="library-toolbar" aria-label="Biblioteca de materiales"><a id="library-link" hidden>Mis materiales</a><button id="open-material-folder" type="button" disabled>Abrir carpeta de este material</button><button id="open-all-materials" type="button" disabled>Abrir carpeta de todos los materiales</button><span id="library-action-status" class="action-status" role="status" aria-live="polite"></span></nav>
    <nav class="case-picker" aria-label="Elegir prueba">
      <label for="material">Material</label>
      <div class="picker-controls">
        <button id="previous" type="button" aria-label="Material anterior">Anterior</button>
        <select id="material"></select>
        <button id="next" type="button" aria-label="Material siguiente">Siguiente</button>
      </div>
    </nav>
    <section class="case" aria-labelledby="case-name">
      <div class="case-heading">
        <h2 id="case-name"></h2>
        <span id="counter" aria-live="polite"></span>
      </div>
      <section class="material-tester" aria-labelledby="tester-title">
        <div class="tester-heading"><h3 id="tester-title">Vista del material</h3><button id="reset-material" type="button">Restablecer</button></div>
        <div class="tester-layout">
          <div class="sphere-stage"><canvas id="material-sphere" tabindex="0" role="img" aria-label="Vista 3D del material. Arrastra o usa las flechas para girar."></canvas><div class="stage-footer"><label class="motion-control"><input type="checkbox" id="rotate-material"> Giro automático</label><p id="sphere-status" role="status" aria-live="polite">Preparando el probador…</p></div></div>
          <div class="control-panel">
            <div class="shape-field"><label for="preview-shape">Forma de prueba</label><select id="preview-shape"><option value="sphere">Esfera</option><option value="rounded-cube">Cubo con bordes redondeados</option><option value="plane">Plano infinito</option></select></div>
            <div class="variant-pickers"><div class="shape-field map-variants roughness-variants"><label for="roughness-variant">Roughness</label><select id="roughness-variant" disabled><option value="original">Original</option><option value="r01">Contraste 1</option><option value="r02">Contraste 2</option><option value="r03">Contraste 3</option></select><button id="download-roughness" type="button" disabled>Descargar Roughness</button><p id="roughness-variant-note" class="control-hint" role="status"></p></div>
            <div class="shape-field map-variants specular-variants"><label for="specular-variant">Specular</label><select id="specular-variant" disabled><option value="original">Original</option><option value="s01">Contraste 1</option><option value="s02">Contraste 2</option><option value="s03">Contraste 3</option></select><button id="download-specular" type="button" disabled>Descargar Specular</button><p id="specular-variant-note" class="control-hint" role="status"></p></div></div>
            <div id="map-controls" class="map-controls"></div><label class="motion-control normal-inversion"><input type="checkbox" id="invert-normal"> Invertir Y del Normal</label>
          </div>
        </div>
      </section>
      <div class="comparison">
        <aside class="reference">
          <h3>Foto original</h3>
          <button class="image-button original-button" id="original-button" type="button" aria-label="Ampliar foto original">
            <img id="original" alt="" decoding="async">
            <span class="expand">Ampliar</span>
          </button>
          <p id="zone" class="zone"></p>
          <div class="reference-actions"><button id="original-actions" type="button">Acciones del original</button><a id="pin" target="_blank" rel="noopener noreferrer">Ver fuente</a></div>
        </aside>
        <div class="outputs">
          <div class="outputs-heading"><h3>Mapas del material</h3><span id="map-dimensions"></span><button id="open-maps" type="button" disabled>Abrir carpeta de mapas</button></div>
          <p id="open-maps-status" class="action-status" role="status" aria-live="polite"></p>
          <div class="map-grid" id="maps"></div>
        </div>
      </div>
    </section>
    <section id="brand-landing" class="brand-landing" aria-label="Recursos de Arquinovatos" hidden><iframe id="brand-landing-frame" title="Recursos de Arquinovatos" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe></section>
    <noscript>Activa JavaScript para seleccionar el material y ver sus mapas.</noscript>
  </main>
  <a id="brand-whatsapp" class="whatsapp-help" target="_blank" rel="noopener noreferrer" aria-label="Ayuda por WhatsApp" hidden><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.7 11.7 0 0 0 2 17.5L.5 23l5.6-1.5A11.7 11.7 0 0 0 20.5 3.5ZM12 21a9.5 9.5 0 0 1-4.9-1.3l-.4-.2-3.3.9.9-3.2-.2-.5A9.4 9.4 0 1 1 12 21Zm5.2-7.1c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1-.2.2-.3.2-.6.1-1.5-.7-2.5-1.5-3.5-3.1-.3-.5.3-.5.9-1.7.1-.2 0-.4 0-.6l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.5.1-.7.3-.7.8-1.1 1.7-1 2.7.2 2.7 2.5 5.4 5.3 6.6 1.8.8 3.2 1.1 4.4.6.6-.3 1.5-1.1 1.7-1.9.2-.8.2-1.4.1-1.5-.1-.2-.3-.3-.6-.4Z"/></svg></a>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <div class="viewer-top"><h2 id="viewer-title"></h2><button id="close-viewer" type="button">Cerrar</button></div>
    <div class="viewer-image"><img id="large-image" alt=""></div>
    <div class="viewer-controls">
      <button id="previous-image" type="button" aria-label="Imagen anterior">Anterior</button>
      <span id="image-counter" aria-live="polite"></span>
      <button id="next-image" type="button" aria-label="Imagen siguiente">Siguiente</button>
    </div>
    <a id="full-file" target="_blank" rel="noopener">Abrir archivo a tamaño completo</a>
  </dialog>
<dialog id="prompt-viewer" aria-labelledby="prompt-title">
    <div class="viewer-top"><h2 id="prompt-title">Prompt del mapa</h2><button id="close-prompt" type="button">Cerrar</button></div>
    <p id="prompt-provenance" class="prompt-hint"></p><p id="prompt-references" class="prompt-hint"></p>
    <label class="sr-only" for="prompt-text">Prompt utilizado</label><textarea id="prompt-text" readonly rows="13" spellcheck="false"></textarea>
    <div class="prompt-actions"><button id="copy-prompt" type="button">Copiar prompt</button><span id="copy-status" role="status" aria-live="polite"></span></div>
  </dialog>
  <div id="file-menu" class="file-menu" role="menu" aria-label="Acciones del archivo" hidden>
    <strong id="file-menu-name"></strong>
    <button id="menu-open" type="button" role="menuitem">Abrir imagen</button>
    <button id="menu-reveal" type="button" role="menuitem">Abrir ubicación del archivo</button>
    <button id="menu-prompt" type="button" role="menuitem">Ver y copiar prompt</button>
    <p id="file-menu-note" role="status"></p>
  </div>
</body>
</html>
